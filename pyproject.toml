[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "relay-opal"
version = "0.1.0"
description = "Relay forward-only credit assignment for pre-norm transformers, with OPAL's agent rewriting the estimator and the optimizer mid-run"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "George Pearse" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<2.11",
    "opal-optimizer==0.3.6",
    "numpy>=1.26.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/GeorgePearse/relay-opal"
Changelog = "https://github.com/GeorgePearse/relay-opal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "polars==1.36.1"]
signals-test = ["weightwatcher==0.7.7", "pyhessian==0.1", "torchvision==0.24.1"]
track1 = ["tokenizers==0.23.1", "datasets==4.8.4", "polars==1.36.1", "modal==1.3.3"]

[tool.maturin]
manifest-path = "rust/signals-py/Cargo.toml"
python-source = "."
module-name = "relay_opal._signals"
python-packages = ["relay_opal"]
include = [{ path = "rust/**", format = "sdist" }, { path = "Cargo.toml", format = "sdist" }, { path = "Cargo.lock", format = "sdist" }, { path = "rustfmt.toml", format = "sdist" }]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905", "B023"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
